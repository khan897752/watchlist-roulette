spring.application.name=watchlist-backend
server.port=${PORT:8080}

# MySQL Connection (reads cloud env vars in prod, falls back to local dev)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/watchlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tiger}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT Configuration
jwt.secret=${JWT_SECRET:watchlistRouletteSuperSecretKeyChangeInProduction2026!}
jwt.expiration-ms=86400000

# Allowed Frontend Origins (comma-separated for local + Vercel URL)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}